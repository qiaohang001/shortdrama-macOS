name: Build Android (烬序影墟)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 删除旧 lock，用 npm install 按 file: 引用解析本地包
      - name: Install frontend dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build frontend (dist)
        run: npm run build

      # Android 无本地 ffmpeg：剥离 bundle.resources 里的 ffmpeg.exe 引用，
      # 否则打包会因资源缺失失败（合并/导出已服务端化）
      - name: Strip desktop-only resources for Android
        run: |
          python3 - <<'EOF'
          import json, io
          p = 'src-tauri/tauri.conf.json'
          with io.open(p, encoding='utf-8') as f:
              cfg = json.load(f)
          res = cfg.get('bundle', {}).get('resources', {})
          if isinstance(res, dict):
              res.pop('resources/ffmpeg.exe', None)
              cfg['bundle']['resources'] = res
          elif isinstance(res, list):
              cfg['bundle']['resources'] = [x for x in res if 'ffmpeg' not in str(x)]
          with io.open(p, 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print('patched resources ->', json.dumps(cfg['bundle']['resources'], ensure_ascii=False))
          EOF

      - name: Ensure icons
        run: |
          SRC=""
          for c in src-tauri/icons/app-icon.png src-tauri/icons/512x512.png src-tauri/icons/128x128.png src-tauri/icons/icon.png; do
            [ -f "$c" ] && SRC="$c" && break
          done
          if [ -z "$SRC" ]; then
            echo "::error::未找到图标源图，请确认 src-tauri/icons/ 目录下存在 png 图标"
            exit 1
          fi
          npx --yes @tauri-apps/cli@2 icon "$SRC" --output src-tauri/icons

      # 本机无 Android SDK，工程由 CI 幂等生成（runner 自带 JDK17 + Android SDK + NDK）
      - name: Init Android project
        run: npx --yes @tauri-apps/cli@2 android init

      # 配置 NDK 工具链环境变量：ring/cc 等 C 依赖在 aarch64-linux-android 交叉编译时必须能找到 clang
      - name: Configure NDK toolchain env (ring/cc crates)
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$LLVM/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      # tauri android build（gradle 链路）：tauri CLI 会自行配置 NDK/链接器，
      # 避免 ring 等 C 依赖找不到 android clang。不能用 tauri-action（它只支持 tauri build 参数）
      - name: Build Android APK
        run: npx --yes @tauri-apps/cli@2 android build

      # unsigned 的 release APK 无法安装：用标准 debug keystore（storepass=android）签名，
      # 产出可安装的 app-*-release.apk。正式发布签名后续可换正式 keystore。
      - name: Sign APK (debug keystore)
        run: |
          set -e
          KEYSTORE=~/.android/debug.keystore
          mkdir -p ~/.android
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -1)
          echo "apksigner=$APKSIGNER"
          find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned*.apk" | while read -r apk; do
            OUT="${apk/-unsigned/}"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android \
              --out "$OUT" "$apk"
            echo "signed -> $OUT"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 烬序影墟-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 发布为 GitHub Release（公开资产，可匿名下载；官网下载可直接指向 Release asset）
      # 用纯 REST API 创建 Release + 上传资产，不依赖 gh CLI；失败显式报错
      - name: Publish Android Release (auto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-${GITHUB_RUN_NUMBER}"
          APKS=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | grep -v unsigned | tr '\n' ' ')
          if [ -z "$APKS" ]; then APKS=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | tr '\n' ' '); fi
          echo "APKS=[$APKS]"
          if [ -z "$APKS" ]; then echo "::error::未找到 APK，无法发布"; exit 1; fi
          H="Authorization: token $GH_TOKEN"
          JSON=$(curl -s -X POST -H "$H" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"烬序影墟 Android Build #$GITHUB_RUN_NUMBER\",\"body\":\"自动构建产物（debug keystore 签名，可安装）\"}")
          echo "$JSON" | grep -q '"id"' || { echo "::error::创建 Release 失败: $JSON"; exit 1; }
          RID=$(echo "$JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "release created id=$RID"
          for f in $APKS; do
            name=$(basename "$f")
            enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$name")
            curl -s -X POST -H "$H" -H "Accept: application/vnd.github+json" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$enc" > /dev/null
            echo "asset uploaded: $name"
          done
