name: Build macOS (烬序影墟)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 删除旧 lock，用 npm install 按 file: 引用解析本地包
      - name: Install frontend dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build frontend (dist)
        run: npm run build

      - name: Bundle macOS ffmpeg
        run: |
          brew install ffmpeg
          mkdir -p src-tauri/resources
          cp "$(which ffmpeg)" src-tauri/resources/ffmpeg

      - name: Patch tauri.conf.json resources for macOS
        run: |
          python3 - <<'EOF'
          import json, io
          p = 'src-tauri/tauri.conf.json'
          with io.open(p, encoding='utf-8') as f:
              cfg = json.load(f)
          res = cfg.get('bundle', {}).get('resources', {})
          if isinstance(res, dict):
              res.pop('resources/ffmpeg.exe', None)
              res['resources/ffmpeg'] = 'ffmpeg'
              cfg['bundle']['resources'] = res
          with io.open(p, 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print('patched resources ->', json.dumps(cfg['bundle']['resources'], ensure_ascii=False))
          EOF

      - name: Ensure .icns icon
        run: |
          if ls src-tauri/icons/*.icns >/dev/null 2>&1; then
            echo "icns already exists"
          else
            SRC=""
            for c in src-tauri/icons/app-icon.png src-tauri/icons/512x512.png src-tauri/icons/128x128.png src-tauri/icons/icon.png; do
              [ -f "$c" ] && SRC="$c" && break
            done
            if [ -z "$SRC" ]; then
              echo "::error::未找到图标源图，请确认 src-tauri/icons/ 目录下存在 png 图标"
              exit 1
            fi
            npx @tauri-apps/cli icon "$SRC" --output src-tauri/icons
          fi

      - name: Build macOS dmg
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: 烬序影墟-macos-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # 发布为 GitHub Release（公开资产，可匿名下载；官网下载可直接指向 Release asset）
      - name: Publish macOS Release (auto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="mac-${GITHUB_RUN_NUMBER}"
          DMGS=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | tr '\n' ' ')
          if [ -n "$DMGS" ]; then
            gh release create "$TAG" $DMGS \
              --repo "${{ github.repository }}" \
              --title "烬序影墟 macOS Build #${GITHUB_RUN_NUMBER}" \
              --notes "自动构建产物（DMG 安装包，可直接安装）" \
              --clobber 2>&1 || echo "release 已存在或失败，跳过"
          fi