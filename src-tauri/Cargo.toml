[package]
name = "shortdrama-desktop"
version = "0.3.0"
description = "AI 视频短剧一站式桌面端"
authors = ["you"]
edition = "2021"

# Android 需要 lib target（Java 层经 JNI 调用）；桌面端仍走 binary target
[lib]
name = "shortdrama_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
